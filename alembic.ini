# Alembic Configuration — CIT Campus Scheduler
#
# Migrations run as `app_migrator` (direct connection, port 5432).
# The runtime application uses `app_api` (pooled, port 6543).
# These roles are NEVER mixed.

[alembic]
# Path to migration scripts
script_location = backend/alembic

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Timezone to use when rendering the date within the migration file
# as well as the filename.
timezone = UTC

# Connection string is read from MIGRATION_DATABASE_URL env var
# via env.py — NOT set here (secrets never in config files).
# sqlalchemy.url is intentionally left blank.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

